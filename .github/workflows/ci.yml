name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Keep the trace when e2e fails: the runner is slower and more loaded than
      # any developer machine, so it catches races that do not reproduce locally,
      # and guessing at them from an assertion message wastes a run per guess.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/atvriders/jellyfin-logwatch:latest
            ghcr.io/atvriders/jellyfin-logwatch:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
